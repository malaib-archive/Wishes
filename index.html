function resize(){if(!canvas)return;let d=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
function launch(){rockets.push({x:W*(.12+Math.random()*.76),y:H+5,target:H*(.12+Math.random()*.5),vx:(Math.random()-.5)*1.5,vy:-5-Math.random()*3,h:[340,43,285,190,15][Math.floor(Math.random()*5)]})}
function burst(x,y,h){for(let i=0,n=75+Math.random()*40;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4.5;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:65+Math.random()*35,max:100,h:h+Math.random()*35,r:.8+Math.random()*1.8})}}
function frame(){requestAnimationFrame(frame);if(!ctx)return;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(19,12,23,.24)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';if(active&&Date.now()-last>330){launch();last=Date.now()}for(let i=rockets.length-1;i>=0;i--){let r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.05;ctx.fillStyle=`hsla(${r.h},95%,75%,.9)`;ctx.beginPath();ctx.arc(r.x,r.y,2,0,7);ctx.fill();if(r.y<r.target||r.vy>0){burst(r.x,r.y,r.h);rockets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life--;ctx.fillStyle=`hsla(${p.h},95%,75%,${Math.max(0,p.life/p.max)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}}
function startFireworks(){if(active)return;canvas=document.getElementById('fireCanvas');ctx=canvas.getContext('2d');resize();window.addEventListener('resize',resize);active=true;last=0;requestAnimationFrame(frame);setTimeout(()=>{active=false;let st=document.getElementById('fireStatus');if(st)st.textContent='HAPPY BIRTHDAY, MALKIN ♡';let title=document.querySelector('#s4 .title');if(title)title.innerHTML='Happy Birthday<br><em>Malkin ♡</em>'},30000)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
</script></body></html>
